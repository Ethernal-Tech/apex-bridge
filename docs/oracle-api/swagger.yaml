basePath: /api
definitions:
  BridgingRequestStateDetailsResponse:
    properties:
      amount:
        description: |-
          Native currency sent to the receivers on the source chain, in wei. Fees are not included, add
          bridgingFee and operationFee to get everything the sender paid in currency.
        type: string
      bridgingFee:
        description: Bridging fee in wei
        type: string
      operationFee:
        description: Operation fee in wei
        type: string
      receivers:
        description: Requested outputs
        items:
          $ref: '#/definitions/BridgingRequestStateReceiverResponse'
        type: array
      senderAddr:
        description: Sender address on the source chain
        type: string
      tokenAmount:
        description: Token sent to the receivers on the source chain, in wei
        type: string
      tokenId:
        description: Token ID, zero when nothing but currency is bridged
        type: integer
    type: object
  BridgingRequestStatePageResponse:
    properties:
      hasMore:
        description: Whether a full page was returned, meaning there may be more
        type: boolean
      instanceId:
        description: |-
          Identifies the oracle database. A different value than the one seen previously means the
          database was recreated and any stored nextFrom is meaningless.
        type: string
      items:
        description: Bridging request states, in the order they were observed
        items:
          $ref: '#/definitions/BridgingRequestStateResponse'
        type: array
      nextFrom:
        description: Sync index to pass as "from" on the next call
        type: integer
    type: object
  BridgingRequestStateReceiverResponse:
    properties:
      address:
        description: Destination address
        type: string
      amount:
        description: Amount in wei
        type: string
      tokenId:
        description: Token ID
        type: integer
    type: object
  BridgingRequestStateResponse:
    properties:
      createdAt:
        description: Time the bridging request was first observed
        type: string
      destinationChainId:
        description: Destination chain ID
        type: string
      destinationTxHash:
        description: Destination transaction hash
        type: string
      details:
        allOf:
        - $ref: '#/definitions/BridgingRequestStateDetailsResponse'
        description: |-
          What was requested to be bridged. Null for refund requests and for requests observed before
          the oracle started recording details.
      isRefund:
        description: Is in refund phase
        type: boolean
      sourceChainId:
        description: Source chain ID
        type: string
      sourceTxHash:
        description: Source transaction hash
        type: string
      status:
        allOf:
        - $ref: '#/definitions/BridgingRequestStatus'
        description: Status of bridging request
    type: object
  BridgingRequestStatus:
    enum:
    - DiscoveredOnSource
    - InvalidRequest
    - SubmittedToBridge
    - IncludedInBatch
    - SubmittedToDestination
    - FailedToExecuteOnDestination
    - ExecutedOnDestination
    type: string
    x-enum-varnames:
    - BridgingRequestStatusDiscoveredOnSource
    - BridgingRequestStatusInvalidRequest
    - BridgingRequestStatusSubmittedToBridge
    - BridgingRequestStatusIncludedInBatch
    - BridgingRequestStatusSubmittedToDestination
    - BridgingRequestStatusFailedToExecuteOnDestination
    - BridgingRequestStatusExecutedOnDestination
  CardanoChainConfigUtxo:
    properties:
      address:
        description: Output address
        type: string
      amount:
        description: Amount of currency
        type: integer
      id:
        description: Transaction hash
        items:
          type: integer
        type: array
      index:
        description: Output index
        type: integer
      slot:
        description: Output slot
        type: integer
      tokens:
        description: List of tokens including their name, policy ID, and amount
        items:
          $ref: '#/definitions/github_com_Ethernal-Tech_cardano-infrastructure_wallet.TokenAmount'
        type: array
    type: object
  ErrorResponse:
    properties:
      err:
        type: string
    type: object
  HasTxFailedResponse:
    properties:
      failed:
        description: true if the transaction failed, false otherwise
        type: boolean
    type: object
  OracleStateResponse:
    properties:
      chainID:
        description: Chain ID
        type: string
      hash:
        description: Latest block hash
        type: string
      slot:
        description: Latest block slot
        type: integer
      utxos:
        description: Unspent transaction outputs
        items:
          $ref: '#/definitions/CardanoChainConfigUtxo'
        type: array
    type: object
  SettingsResponse:
    properties:
      directionConfig:
        additionalProperties:
          $ref: '#/definitions/common.DirectionConfig'
        description: For each chain, the direction config
        type: object
      ecosystemTokens:
        description: All defined tokens across the whole ecosystem
        items:
          $ref: '#/definitions/common.EcosystemToken'
        type: array
      maxAmountAllowedToBridge:
        description: Maximum amount of currency allowed to be bridged
        type: string
      maxReceiversPerBridgingRequest:
        description: Maximum number of receivers allowed in a bridging request
        type: integer
      maxTokenAmountAllowedToBridge:
        description: Maximum amount of native tokens allowed to be bridged
        type: string
      minChainFeeForBridging:
        additionalProperties:
          type: string
        description: |-
          For each chain, the minimum fee required to cover the submission of the currency transaction
          on the destination chain
        type: object
      minChainFeeForBridgingTokens:
        additionalProperties:
          format: int64
          type: integer
        description: |-
          For each chain, the minimum fee required to cover the submission of the native token transaction
          on the destination chain
        type: object
      minColCoinsAllowedToBridge:
        additionalProperties:
          type: string
        description: Minimum amount of colored tokens allowed to be bridged for each
          chain
        type: object
      minOperationFee:
        additionalProperties:
          type: string
        description: For each chain, the minimum fee required to cover operational
          costs
        type: object
      minUtxoChainValue:
        additionalProperties:
          format: int64
          type: integer
        description: For each chain, the minimum allowed UTXO value
        type: object
      minValueToBridge:
        description: Minimum value allowed to be bridged
        type: integer
    type: object
  common.DirectionConfig:
    properties:
      alwaysTrackCurrencyAndWrappedCurrency:
        type: boolean
      destChain:
        additionalProperties:
          items:
            $ref: '#/definitions/common.TokenPair'
          type: array
        type: object
      tokens:
        additionalProperties:
          $ref: '#/definitions/common.Token'
        type: object
    type: object
  common.EcosystemToken:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  common.Token:
    properties:
      chainSpecific:
        type: string
      isWrappedCurrency:
        type: boolean
      lockUnlock:
        type: boolean
    type: object
  common.TokenPair:
    properties:
      dstTokenID:
        type: integer
      srcTokenID:
        type: integer
      trackDestination:
        type: boolean
      trackSource:
        type: boolean
    type: object
  github_com_Ethernal-Tech_cardano-infrastructure_wallet.TokenAmount:
    properties:
      nam:
        description: Human-readable name of the token
        type: string
      pid:
        description: Hexadecimal hash of the monetary policy script
        type: string
      val:
        description: Quantity of the token
        type: integer
    type: object
info:
  contact: {}
  title: Oracle API
  version: "1.0"
paths:
  /BridgingRequestState/Get:
    get:
      description: Returns the current status of a bridging request, along with the
        destination chain ID and transaction hash, based on the given source chain
        ID and transaction hash.
      parameters:
      - description: Source chain ID
        in: query
        name: chainId
        required: true
        type: string
      - description: Source transaction hash
        in: query
        name: txHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK - Returns the bridging request with its current state.
          schema:
            $ref: '#/definitions/BridgingRequestStateResponse'
        "400":
          description: Bad Request – One or more query parameters are missing, or
            the bridging request state could not be retrieved.
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized – API key missing or invalid.
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found - No bridging request found for the given parameters.
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get state of bridging request
      tags:
      - BridgingRequestState
  /BridgingRequestState/GetMultiple:
    get:
      description: Returns statuses and related data for one or more bridging requests,
        based on the given source chain ID and transaction hash(es).
      parameters:
      - description: Source chain ID
        in: query
        name: chainId
        required: true
        type: string
      - collectionFormat: multi
        description: Source transaction hashes
        in: query
        items:
          type: string
        name: txHash
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK – Returns a map with source transaction hashes as keys and
            the associated bridging request data as values.
          schema:
            additionalProperties:
              $ref: '#/definitions/BridgingRequestStateResponse'
            type: object
        "400":
          description: Bad Request – chainId is missing from the query or the bridging
            request states could not be retrieved.
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized – API key missing or invalid.
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get states of multiple bridging requests
      tags:
      - BridgingRequestState
  /BridgingRequestState/GetPage:
    get:
      description: Returns bridging request states in the order the oracle observed
        them, starting at the given sync index. Pass the returned nextFrom as "from"
        to get the following page. A change in the returned instanceId means the oracle
        database was recreated and any stored sync index should be discarded.
      parameters:
      - default: 0
        description: Sync index to start from
        in: query
        name: from
        type: integer
      - default: 100
        description: Maximum number of states to return
        in: query
        maximum: 1000
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK - Returns a page of bridging request states.
          schema:
            $ref: '#/definitions/BridgingRequestStatePageResponse'
        "400":
          description: Bad Request – from or limit is not a valid number, or the bridging
            request states could not be retrieved.
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized – API key missing or invalid.
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get a page of bridging request states
      tags:
      - BridgingRequestState
  /OracleState/Get:
    get:
      description: Returns all unspent transaction outputs of bridging addresses for
        the given chain ID. Each UTXO includes the address it belongs to, along with
        amount and other relevant data.
      parameters:
      - description: Chain ID
        in: query
        name: chainId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK - Returns Oracle state.
          schema:
            $ref: '#/definitions/OracleStateResponse'
        "400":
          description: Bad Request – chainId is missing from the query or invalid,
            or the transaction outputs could not be retrieved.
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized – API key missing or invalid.
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get unspent transaction outputs of bridging addresses on specific chain
      tags:
      - OracleState
  /OracleState/GetHasTxFailed:
    get:
      description: Returns whether the transaction failed. A transaction is considered
        failed if it is not found on Oracle and if its TTL has expired.
      parameters:
      - description: Source chain ID
        in: query
        name: chainId
        required: true
        type: string
      - description: Source transaction hash
        in: query
        name: txHash
        required: true
        type: string
      - description: Transaction TTL
        in: query
        name: ttl
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK - Returns transaction failure status.
          schema:
            $ref: '#/definitions/HasTxFailedResponse'
        "400":
          description: Bad Request – One or more query parameters are missing or invalid,
            or the transaction could not be retrieved.
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized – API key missing or invalid.
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get transaction failure status
      tags:
      - OracleState
  /Settings/Get:
    get:
      description: Returns configuration settings for the bridge, including global
        parameters such as minimum and maximum bridging amounts, as well as any per-chain
        specific settings.
      produces:
      - application/json
      responses:
        "200":
          description: OK - Returns bridge configuration.
          schema:
            $ref: '#/definitions/SettingsResponse'
        "401":
          description: Unauthorized – API key missing or invalid.
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get bridge settings for all supported chains
      tags:
      - Settings
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
