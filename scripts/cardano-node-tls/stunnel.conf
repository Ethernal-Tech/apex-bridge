; TLS terminator in front of a cardano-node, node side. Run: stunnel stunnel.conf
; Use a separate port (5522): the node's own port keeps serving Cardano peers in plain.

; stay in the foreground and log to stderr (needed in containers and under systemd)
foreground = yes

[cardano-node-tls]
; listen on the TLS port, on all interfaces (firewall it to the validator IPs)
accept = 0.0.0.0:5522
; forward the decrypted stream to the local cardano-node
connect = 127.0.0.1:3001
; resolve the service name on every connection, so a restarted node container with a new IP is still reached
delay = yes
; server certificate, its key and the private CA that signs the validator certificates
cert = /etc/stunnel/node-tls/server.crt
key = /etc/stunnel/node-tls/server.key
CAfile = /etc/stunnel/node-tls/ca.crt
; verify the client certificate against CAfile only, and require one
verifyChain = yes
requireCert = yes
; TLS 1.3 only
sslVersionMin = TLSv1.3
